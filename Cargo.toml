[workspace]
members = ["crates/ciao-core", "crates/ciao"]
resolver = "2"

[workspace.package]
version = "0.1.28"
edition = "2021"
rust-version = "1.80"
license = "AGPL-3.0-only"
authors = ["Luca La Barbera"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
