name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: ciao-linux-x86_64
            use_cross: false
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: ciao-linux-arm64
            use_cross: true
          - runner: macos-13
            target: x86_64-apple-darwin
            asset: ciao-macos-x86_64
            use_cross: false
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: ciao-macos-arm64
            use_cross: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            CARGO_INCREMENTAL=0 cross build --locked --release --package ciao --target "${{ matrix.target }}"
          else
            CARGO_INCREMENTAL=0 cargo build --locked --release --package ciao --target "${{ matrix.target }}"
          fi
          cp "target/${{ matrix.target }}/release/ciao" "${{ matrix.asset }}"
          chmod 0755 "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum ciao-* > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
